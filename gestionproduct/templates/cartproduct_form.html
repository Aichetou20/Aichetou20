{% extends 'base.html' %}

{% block title %}Formulaire Produit dans le Panier{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">{{ form.instance.pk|yesno:"Modifier un Produit dans le Panier,Ajouter un Produit au Panier" }}</h1>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ form.instance.pk|yesno:"Mettre à Jour,Ajouter" }}</button>
        <a href="{% url 'cartproduct-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
