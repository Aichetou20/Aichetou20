{% extends 'base.html' %}

{% block title %}Formulaire Prix des Produits{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">{{ form.instance.pk|yesno:"Modifier le Prix,Créer un Nouveau Prix" }}</h1>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ form.instance.pk|yesno:"Mettre à Jour,Créer" }}</button>
        <a href="{% url 'productprice-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
