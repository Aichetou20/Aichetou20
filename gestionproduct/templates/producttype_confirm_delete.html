{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmer la suppression</h2>
    <p>Êtes-vous sûr de vouloir supprimer le type de produit "{{ object.label }}" ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'producttype-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
