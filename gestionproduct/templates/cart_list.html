{% extends 'base.html' %}

{% block title %}Liste des Paniers{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Liste des Paniers</h1>
    <a href="{% url 'cart-create' %}" class="btn btn-success mb-3">Créer un nouveau Panier</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for cart in object_list %}
            <tr>
                <td>{{ cart.code }}</td>
                <td>{{ cart.name }}</td>
                <td>{{ cart.description }}</td>
                <td>
                    <a href="{% url 'cart-update' cart.pk %}" class="btn btn-primary btn-sm">Modifier</a>
                    <a href="{% url 'cart-delete' cart.pk %}" class="btn btn-danger btn-sm">Supprimer</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
