{% extends "base.html" %}

{% block content %}
<h1>Supprimer le produit</h1>

<p>Êtes-vous sûr de vouloir supprimer le produit <strong>{{ object.name }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'product-list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
