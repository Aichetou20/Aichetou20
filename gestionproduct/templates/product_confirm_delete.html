{% extends "base.html" %}  <!-- Hérite du template de base -->

{% block content %}
<div class="container mt-4">
    <h2>Confirmer la suppression</h2>
    <p>Êtes-vous sûr de vouloir supprimer le produit "{{ object.name }}" ?</p>
    
    <form method="post">
        {% csrf_token %}  <!-- Protection contre les attaques CSRF -->
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'product-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
