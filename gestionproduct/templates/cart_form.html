{% extends 'base.html' %}

{% block title %}Formulaire Panier{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">{{ view.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="{% url 'cart-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
