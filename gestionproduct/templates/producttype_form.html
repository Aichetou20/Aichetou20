{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>
        {% if object %}
            Modifier le type de produit "{{ object.label }}"
        {% else %}
            Créer un nouveau type de produit
        {% endif %}
    </h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if object %}
                Enregistrer les modifications
            {% else %}
                Créer
            {% endif %}
        </button>
        <a href="{% url 'producttype-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
