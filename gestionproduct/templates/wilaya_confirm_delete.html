{% extends 'base.html' %}

{% block title %}Supprimer Wilaya{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Supprimer la Wilaya</h1>
    <p>Êtes-vous sûr de vouloir supprimer la wilaya suivante ?</p>
    <ul>
        <li><strong>Code :</strong> {{ object.code }}</li>
        <li><strong>Nom :</strong> {{ object.name }}</li>
    </ul>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer</button>
        <a href="{% url 'wilaya-list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
