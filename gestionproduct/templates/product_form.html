{% extends "base.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} un produit</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">{% if form.instance.pk %}Mettre à jour{% else %}Créer{% endif %}</button>
    <a href="{% url 'product-list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
